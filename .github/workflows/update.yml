name: Update scorigami

on:
  schedule:
    - cron: "17 20 * * *"   # every day at 20:17 UTC (6:17am in Brisbane); only commits when a new Test has arrived
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    paths: ["data/**", "scorigami/**"]

permissions:
  contents: write

concurrency:
  group: scorigami
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check the parser against the fixtures
        run: python -m pytest -q tests
      - name: Download Cricsheet and rebuild
        run: python -m scorigami.build
      - name: Commit the new page and CSVs
        run: |
          git config user.name "scorigami-bot"
          git config user.email "scorigami-bot@users.noreply.github.com"
          git add docs out
          if git diff --cached --quiet; then
            echo "No new Tests since the last run."
          else
            git commit -m "Scorigami update $(date -u +%F)"
            git push
          fi
